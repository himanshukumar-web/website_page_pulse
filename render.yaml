services:
  - type: web
    name: page-pulse-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: REQUEST_TIMEOUT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
